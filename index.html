<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATC Training Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}
header{background:#111827;color:#fff;padding:24px 20px}main{max-width:650px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{margin:0;font-size:25px}h2{font-size:18px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 7px;color:#4b5563}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shift{padding:12px 5px;border:1px solid #d1d5db;border-radius:11px;background:white;font-weight:700}.shift small{display:block;color:#6b7280}.selected{background:#111827;color:white}.selected small{color:#d1d5db}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;margin-top:16px}
.report{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:14px;white-space:pre-wrap;font-family:monospace;line-height:1.6}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px}.muted{color:#6b7280;font-size:13px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.delete{border:0;border-radius:9px;padding:8px;background:#fee2e2;color:#991b1b}
.today-preview{background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;padding:14px;margin-top:12px}.today-preview b{color:#92400e}
</style></head>
<body><header><h1>ATC Training Tracker</h1><div>Planner • Executive • Shift history</div></header><main>
<section class="card"><h2>Log today's training</h2>
<label>Date</label><input id="date" type="date">
<label>Shift</label><div class="grid">
<button class="shift" data-s="E">E<small>Early</small></button><button class="shift" data-s="F">F<small>Day</small></button>
<button class="shift" data-s="G">G<small>Day</small></button><button class="shift" data-s="H">H<small>Day</small></button>
<button class="shift" data-s="A">A<small>Afternoon</small></button><button class="shift" data-s="N">N<small>Night</small></button></div>
<div class="row"><div><label>Planner hours</label><input id="planner" type="number" min="0" step=".25"></div>
<div><label>Executive hours</label><input id="executive" type="number" min="0" step=".25"></div></div>
<button class="btn" id="save">Save shift</button></section>
<section class="card"><h2>Next report</h2><div class="report" id="report"></div><button class="btn" id="copy">Copy report</button>
<div class="today-preview" id="todayPreview" style="display:none"><b>Today's entry (not yet saved):</b><div id="todayDetails"></div></div></section>
<section class="card"><h2>Cumulative training</h2><div class="stats">
<div class="stat"><b id="pt">0</b><span>Planner hours</span></div><div class="stat"><b id="et">0</b><span>Executive hours</span></div>
<div class="stat"><b id="st">0</b><span>Total shifts</span></div><div class="stat"><b id="tt">0</b><span>Total hours</span></div></div></section>
<section class="card"><h2>History</h2><div id="history"></div></section>
</main>
<script>
const API_URL="";
let selected=null,records=[],draft={shift:null,planner:0,executive:0};const $=x=>document.getElementById(x);
$("date").value=new Date().toISOString().slice(0,10);
document.querySelectorAll(".shift").forEach(b=>b.onclick=()=>{
    selected=b.dataset.s;draft.shift=selected;
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");updateTodayPreview()});
$("planner").oninput=$("executive").oninput=()=>{
    draft.planner=+$("planner").value||0;draft.executive=+$("executive").value||0;updateTodayPreview()};
function updateTodayPreview(){
    if(!draft.shift||(draft.planner===0&&draft.executive===0)){
        $("todayPreview").style.display="none";return}
    $("todayPreview").style.display="block";
    $("todayDetails").textContent=`Shift ${draft.shift} · Planner ${f(draft.planner)}h · Executive ${f(draft.executive)}h`}
async function load(){
    if(!API_URL)records=JSON.parse(localStorage.getItem("atc_records")||"[]");
    else{let r=await fetch(API_URL+"/api/records");records=await r.json()}render()}
async function save(){
    if(!selected)return alert("Select a shift first.");
    let item={date:$("date").value,shift:selected,planner:+$("planner").value||0,executive:+$("executive").value||0};
    if(API_URL)await fetch(API_URL+"/api/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)});
    else{records.push(item);localStorage.setItem("atc_records",JSON.stringify(records))}
    selected=null;draft={shift:null,planner:0,executive:0};
    document.querySelectorAll(".shift").forEach(x=>x.classList.remove("selected"));
    $("planner").value="";$("executive").value="";$("todayPreview").style.display="none";await load()}
async function del(i){if(!confirm("Delete this record?"))return;
    if(API_URL)await fetch(API_URL+"/api/records/"+records[i].id,{method:"DELETE"});
    else{records.splice(i,1);localStorage.setItem("atc_records",JSON.stringify(records))}await load()}
function f(n){return Number.isInteger(n)?n:n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function render(){
    // Calculate totals from SAVED records only (report shows "prior to this report")
    let t={E:0,F:0,G:0,H:0,A:0,N:0,p:0,e:0};
    records.forEach(r=>{t[r.shift]++;t.p+=r.planner;t.e+=r.executive});

    // Report text - exactly as instructor expects
    $("report").textContent=`Early (E): ${t.E}\nDay (F,G,H): ${t.F+t.G+t.H}\nAfternoon (A): ${t.A}\nNight (N): ${t.N}\n\nTraining hours prior to this report\nPlanner: ${f(t.p)}\nExecutive: ${f(t.e)}`;

    // Cumulative stats INCLUDE today's draft if entered
    let totalP=t.p+draft.planner,totalE=t.e+draft.executive;
    $("pt").textContent=f(totalP);$("et").textContent=f(totalE);
    $("st").textContent=records.length+(draft.shift?1:0);$("tt").textContent=f(totalP+totalE);

    $("history").innerHTML=records.length?records.map((r,i)=>`<div class="item"><div><b>${r.date}</b> · ${r.shift}<div class="muted">Planner ${f(r.planner)}h · Executive ${f(r.executive)}h</div></div><button class="delete" onclick="del(${i})">Delete</button></div>`).join(""):"<div class='muted'>No shifts recorded yet.</div>"}
$("save").onclick=save;$("copy").onclick=async()=>{
    await navigator.clipboard.writeText($("report").textContent);
    $("copy").textContent="Copied ✓";setTimeout(()=>$("copy").textContent="Copy report",1200)};load();
</script></body></html>
